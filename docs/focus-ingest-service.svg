<text x="800" y="428" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">ingest-service  :8088</text>
<text x="800" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">공공데이터를 받아 원문 그대로 담음</text>
<text x="800" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 4개 · 화면 없음 · 상시 미기동</text>
<text x="612.0" y="381.0" font-size="13" font-weight="bold" text-anchor="start" fill="#22C55E">이 레포</text>
<rect x="50.0" y="95.0" width="260" height="90" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="180" y="118" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Jenkins 잡</text>
<text x="180" y="138" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">수집을 언제 부를지 정함</text>
<text x="180" y="154" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">아직 없음</text>
<rect x="50.0" y="310.0" width="260" height="100" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="180" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">공공데이터포털</text>
<text x="180" y="358" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">반려동물 동반여행 · 고캠핑</text>
<text x="180" y="374" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">오퍼레이션마다 하루 1,000회</text>
<rect x="50.0" y="535.0" width="260" height="90" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.2"/>
<text x="180" y="558" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">문화정보원 CSV</text>
<text x="180" y="578" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">이미지 안에 담겨 있음</text>
<text x="180" y="594" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">바깥을 부르지 않음</text>
<rect x="50.0" y="755.0" width="260" height="70" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="180" y="776" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">gateway-server</text>
<text x="180" y="796" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">여기로는 라우팅하지 않음</text>
<rect x="640.0" y="80.0" width="320" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="800" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">config-server</text>
