<polyline points="310.0,590 520,590 520,500 650,500" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="526" y="548" width="73" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="530" y="560" font-size="13" font-weight="normal" text-anchor="start" fill="#F97316">파일을 읽음</text>
<polyline points="310.0,830 600,830 600,560 760,525" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
<rect x="606" y="718" width="97" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="610" y="730" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">라우팅하지 않음</text>
<polyline points="840,160.0 840,415.0" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="802" y="268" width="76" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="840.0" y="279.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">기동 시 설정</text>
