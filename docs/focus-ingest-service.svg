<rect x="1306" y="248" width="34" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1310" y="260" font-size="13" font-weight="normal" text-anchor="start" fill="#6366F1">등록</text>
<polyline points="1030.0,470 1300,470 1300,310 1490.0,310" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="1306" y="373" width="147" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1310" y="385" font-size="13" font-weight="normal" text-anchor="start" fill="#F97316">JPA · Flyway V20 · V21</text>
<polyline points="1490,570 1180,570 1180,490 1030,490" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1245" y="550" width="239" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1480" y="562" font-size="13" font-weight="normal" text-anchor="end" fill="#16A34A">GET /internal/raw · PATCH 로 결과 반영</text>
<polyline points="1030,512 1390,512 1390,800 1490,800" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1396" y="678" width="179" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1400" y="690" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">LINK  소스 셋을 담아 둔 뒤 넘김</text>
<polyline points="1490,858 1250,858 1250,532 1030,532" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1046" y="838" width="249" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1050" y="850" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">GET /internal/raw/{placeId}/documents</text>
<polyline points="900,525 900,940 1560,940 1560,885" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="906" y="918" width="190" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="910" y="930" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">DIRECT  raw 를 거치지 않고 바로</text>
<text x="40" y="968" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">소스가 넷인데 셋만 raw_db 에 담김 — 행정안전부 동물병원은 조건 문장이 없어 해석할 것도 원문으로 보여줄 것도 없어, 읽는 자리에서 바로 place 로 보냄</text>
<text x="40" y="990" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">관광공사 상세는 한 번에 3,237회라 하루 한도를 넘김 — 그날 받은 데까지 기록하고 다음 날 그 자리부터 이어받음 · 게이트웨이가 /internal 을 라우팅하지 않고 Kafka 도 쓰지 않음</text>
<text x="1956" y="998" font-size="11" text-anchor="end" fill="#9CA3AF">ingest-service 를 중심으로 · 직접 연결된 것만</text></svg>