<text x="840" y="448" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">ingest-service  :8088</text>
<text x="840" y="468" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">공공데이터를 받아 담고 place 로 넘김</text>
<text x="840" y="484" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 5개 · 화면 없음 · 상시 미기동</text>
<text x="642.0" y="401.0" font-size="13" font-weight="bold" text-anchor="start" fill="#22C55E">이 레포</text>
<rect x="50.0" y="95.0" width="260" height="90" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="180" y="118" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Jenkins 잡</text>
<text x="180" y="138" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">수집을 언제 부를지 정함</text>
<text x="180" y="154" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">아직 없음</text>
<rect x="50.0" y="310.0" width="260" height="100" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="180" y="338" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">공공데이터포털</text>
<text x="180" y="358" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">반려동물 동반여행 · 고캠핑</text>
<text x="180" y="374" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">오퍼레이션마다 하루 1,000회</text>
<rect x="50.0" y="540.0" width="260" height="100" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.2"/>
<text x="180" y="568" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">CSV 파일 둘</text>
<text x="180" y="588" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">문화정보원 · 행정안전부</text>
<text x="180" y="604" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">이미지 안에 담겨 있음</text>
<rect x="50.0" y="795.0" width="260" height="70" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="180" y="816" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">gateway-server</text>
<text x="180" y="836" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">여기로는 라우팅하지 않음</text>
<rect x="680.0" y="80.0" width="320" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="840" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">config-server</text>
<text x="840" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">포트 · DB · 인증키 · 소스별 값</text>
<rect x="1490.0" y="70.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="1640" y="96" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">eureka-server</text>
<text x="1640" y="116" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">등록</text>
<rect x="1490.0" y="255.0" width="300" height="110" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="1640" y="280" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">PostgreSQL  raw_db</text>
<text x="1640" y="300" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">raw_document 17,471건 · place_id 17,463</text>
<text x="1640" y="316" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">ingest_run  (표 2개)</text>
<text x="1640" y="332" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">소스 넷 가운데 셋만 담김</text>
<rect x="1490.0" y="520.0" width="300" height="100" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1640" y="548" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">extract-service</text>
<text x="1640" y="568" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">대기 문서를 가져가 해석</text>
<text x="1640" y="584" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">아직 없음</text>
<rect x="1490.0" y="775.0" width="300" height="110" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1640" y="800" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">place-service</text>
<text x="1640" y="820" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">소스가 겹친 것을 한 장소로</text>
<text x="1640" y="836" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">넘긴 결과를 돌려줌</text>
<text x="1640" y="852" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">동물병원은 바로 받음</text>
<polyline points="310.0,140 520,140 520,440 650,440" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
