<text x="1130" y="370" font-size="13" font-weight="normal" text-anchor="start" fill="#F97316">JPA · Flyway V20 · V21</text>
<polyline points="1270.0,560 1120,560 1120,470 980.0,450" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="886" y="536" width="239" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="890" y="548" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">GET /internal/raw · PATCH 로 결과 반영</text>
<polyline points="980,490 1050,520 1050,780 1270.0,780" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)" stroke-dasharray="7,6"/>
<rect x="1056" y="678" width="220" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1060" y="690" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">POST /internal/places/bulk  (2단계)</text>
<text x="40" y="858" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">게이트웨이가 /internal 을 라우팅하지 않음 — 화면이 없고 부르는 것이 Jenkins 잡과 extract 뿐임 · Kafka 를 쓰지 않아 이벤트를 발행하지도 받지도 않음</text>
<text x="40" y="880" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">관광공사 상세는 한 번에 3,237회라 하루 한도를 넘김 — 그날 받은 데까지 기록하고 다음 날 그 자리부터 이어받음 · 원문은 고치지 않고 담고 해석은 extract 가 함</text>
<text x="1616" y="888" font-size="11" text-anchor="end" fill="#9CA3AF">ingest-service 를 중심으로 · 직접 연결된 것만</text></svg>