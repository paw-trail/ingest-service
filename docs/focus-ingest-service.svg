<text x="1420" y="96" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">eureka-server</text>
<text x="1420" y="116" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">등록</text>
<rect x="1270.0" y="250.0" width="300" height="100" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="1420" y="278" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">PostgreSQL  raw_db</text>
<text x="1420" y="298" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">raw_document 17,480건</text>
<text x="1420" y="314" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">ingest_run  (표 2개)</text>
<rect x="1270.0" y="510.0" width="300" height="100" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1420" y="538" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">extract-service</text>
<text x="1420" y="558" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">대기 문서를 가져가 해석</text>
<text x="1420" y="574" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">아직 없음</text>
<rect x="1270.0" y="735.0" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="1420" y="758" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">place-service</text>
<text x="1420" y="778" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">장소로 합치는 곳</text>
<text x="1420" y="794" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">2단계에서 부름</text>
